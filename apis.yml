aid: alloy-enterprises
name: Alloy Enterprises
description: 'Alloy Enterprises is a Burlington, Massachusetts advanced-manufacturing company that
  makes single-piece aluminum thermal management components using Stack Forging, its patented
  digital fabrication process. Rather than printing from metal powder, Stack Forging laser-cuts
  sheets of aluminum and diffusion-bonds them under controlled heat and pressure into monolithic,
  porosity-free parts carrying complex internal geometries that casting, forging and machining
  cannot produce. The company sells cold plates, liquid-cooling components, vapor chambers and
  oscillating heat pipes into data-center cooling, defense electronics, photonics, semiconductor
  equipment, e-mobility, heavy equipment and industrial fluid-handling markets, and states its
  parts cut pressure drop by up to 4x and improve thermal resistance by more than 35%. Founded in
  2020 and spun out of work begun in Somerville, Massachusetts, Alloy Enterprises was acquired by
  Johnson Controls in a deal signed 2026-02-18 and closed 2026-05-13, and now operates as part of
  that company''s data-center thermal management business. Alloy Enterprises is a hardware and
  materials manufacturer: it publishes no public developer API, developer portal, SDK, CLI,
  sandbox, status page or machine-readable specification of any kind. See x-coverage below.'
