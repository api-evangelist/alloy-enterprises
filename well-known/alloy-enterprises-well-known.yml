wordpress_rest_api:
  observed: true
  url: https://alloyenterprises.co/wp-json/
  harvested: false
  reason: robots-disallow
  robots_txt: https://alloyenterprises.co/robots.txt
  robots_directive: |
    User-agent: *
    Disallow: /wp-json/
    Disallow: /?rest_route=
  note: >-
    alloyenterprises.co runs WordPress and its route index at /wp-json/ answers anonymously.
    The site's own robots.txt (HTTP 200, served with Crawl-delay: 10) explicitly disallows
    /wp-json/ and /?rest_route= for all user agents. API Evangelist honors robots.txt: no
    OpenAPI was derived from that route index and no openapi/ artifact was written for this
    provider, even though the equivalent CMS surface has been captured for other manufacturers
    in this catalog whose robots.txt did not disallow it. This is a deliberate abstention, not
    a discovery failure. It changes nothing about the company's API posture either way — the
    WordPress REST API is the corporate website's content/CMS plumbing, not a product API, and
    Alloy Enterprises ships no product API.

