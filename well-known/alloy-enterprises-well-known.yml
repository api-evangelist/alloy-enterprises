    - {path: /api-docs, status: 404}
    - {path: /docs, status: 404}
    - {path: /redoc, status: 404}
    - {path: /api, status: 404}
    note: >-
      Every one of these returned the WordPress theme's 404 page (~105 KB of text/html), not a
      spec. There is no API host to probe separately: api., docs., developer., developers.,
      portal., status. and app..alloyenterprises.co all return NXDOMAIN, so the marketing site
      is the only host in play.
